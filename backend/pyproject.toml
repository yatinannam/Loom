[project]
name = "loom-backend"
version = "0.1.0"
description = "Loom GraphRAG backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "neo4j>=5.20",
    "chromadb>=0.5",
    "pypdf>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
